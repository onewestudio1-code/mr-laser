<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="MR LASER - مس لايزر | شريكك الصناعي">
    <title>MR LASER | مس لايزر - تواصل معنا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --bg-card-hover: #1c1c1c;
            --gold: #d4af37;
            --gold-bright: #e8c458;
            --white: #ffffff;
            --text-light: #c9c9c9;
            --text-mid: #8a8a8a;
            --border-gold: rgba(212, 175, 55, 0.5);
        }

        html, body { min-height: 100%; }

        body {
            background:
                radial-gradient(circle at 20% 0%, #1a1a1a 0%, transparent 55%),
                radial-gradient(circle at 80% 100%, #151515 0%, transparent 55%),
                linear-gradient(160deg, #0a0a0a 0%, #050505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            color: var(--white);
            overflow-x: hidden;
        }

        .card {
            max-width: 720px;
            width: 100%;
            background: linear-gradient(180deg, #141414 0%, #0f0f0f 100%);
            border-radius: 36px;
            box-shadow:
                0 40px 80px -30px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(212, 175, 55, 0.12) inset,
                0 0 60px rgba(212, 175, 55, 0.05);
            padding: 34px 22px 26px;
            position: relative;
            overflow: hidden;
            animation: cardIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.7;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (min-width: 640px) {
            .card { padding: 50px 44px 36px; border-radius: 42px; }
        }

        /* ============ قسم اللوجو ============ */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-wrapper {
            width: 100%;
            max-width: 280px;
            margin: 0 auto 22px;
            border-radius: 22px;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 20px 40px -18px rgba(212, 175, 55, 0.25),
                0 0 0 1px rgba(212, 175, 55, 0.2);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
            background: #000000;
            aspect-ratio: 1 / 1;
        }

        .logo-wrapper:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow:
                0 28px 55px -18px rgba(212, 175, 55, 0.4),
                0 0 0 1px rgba(212, 175, 55, 0.4);
        }

        .logo-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
        }

        /* Placeholder يظهر إذا لم توجد الصورة */
        .logo-fallback {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            color: var(--gold);
            background: #000;
            font-family: 'Tahoma', sans-serif;
        }

        .logo-fallback .fb-icon {
            font-size: 3rem;
            opacity: 0.5;
        }

        .logo-fallback .fb-text {
            font-size: 0.85rem;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* ============ شبكة التواصل ============ */
        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-card);
            border-radius: 22px;
            padding: 13px 16px;
            box-shadow:
                0 6px 16px -8px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-decoration: none;
            color: var(--white);
            cursor: pointer;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .contact-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(212, 175, 55, 0.08) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .contact-item:hover {
            transform: translateY(-2px);
            background: var(--bg-card-hover);
            box-shadow:
                0 16px 30px -14px rgba(0, 0, 0, 0.9),
                0 0 0 1px var(--border-gold);
        }

        .contact-item:hover::after { opacity: 1; }
        .contact-item:active { transform: translateY(0); }

        .contact-item.static { cursor: default; }
        .contact-item.static:hover {
            transform: none;
            background: var(--bg-card);
            box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
        }
        .contact-item.static:hover::after { opacity: 0; }

        .icon-circle {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #1f1f1f, #141414);
            box-shadow:
                0 0 0 1px rgba(212, 175, 55, 0.2) inset,
                0 2px 6px rgba(0, 0, 0, 0.5);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .contact-item:hover .icon-circle {
            transform: scale(1.06) rotate(-2deg);
            box-shadow:
                0 0 0 1px rgba(212, 175, 55, 0.5) inset,
                0 4px 12px rgba(212, 175, 55, 0.15);
        }

        .icon-circle svg { width: 22px; height: 22px; display: block; stroke: var(--gold); }

        .label {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .main-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-mid);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            word-break: break-word;
            line-height: 1.35;
        }

        .value.ltr {
            direction: ltr;
            text-align: right;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            letter-spacing: 0.3px;
            font-weight: 600;
            color: var(--gold-bright);
        }

        .value.arabic {
            direction: rtl;
            text-align: right;
            font-weight: 500;
            font-size: 0.94rem;
            color: var(--text-light);
        }

        .arrow {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            opacity: 0.5;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .arrow svg { width: 18px; height: 18px; }

        .contact-item:hover .arrow { opacity: 1; transform: translateX(-3px); }
        .contact-item.static .arrow { opacity: 0.15; }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            margin: 22px 0 14px;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-mid);
            letter-spacing: 3px;
            text-transform: uppercase;
            direction: ltr;
            font-weight: 500;
        }

        @media (max-width: 380px) {
            .card { padding: 26px 16px 20px; border-radius: 28px; }
            .logo-wrapper { max-width: 220px; }
            .value { font-size: 0.92rem; }
            .icon-circle { width: 42px; height: 42px; border-radius: 12px; }
        }
    </style>
</head>

            if (fallback) fallback.style.display = 'flex';
